# `docker compose up --build` runs the app at http://localhost:3000 with its MySQL
# (copy .env.example to .env and add GOOGLE_GENERATIVE_AI_API_KEY).
# For `npm run dev`, start just the database: `docker compose up -d mysql`.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: aiapp
      MYSQL_DATABASE: ai_app
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-paiapp"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides MYSQL_URL from .env: inside compose the database is at host "mysql".
      MYSQL_URL: mysql://root:aiapp@mysql:3306/ai_app
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql-data:
